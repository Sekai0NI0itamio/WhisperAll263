name: build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "8.14.5"}
      - run: chmod +x gradlew && ./gradlew build --no-daemon --warning-mode all
      - if: always()
        run: |
          ls -la build/libs/
          test -s build/libs/whisperall-1.20.1-forge-*.jar || (echo "FAIL: mod JAR not found" && exit 1)
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: whisperall-forge-jar, path: build/libs/*.jar, if-no-files-found: error}
